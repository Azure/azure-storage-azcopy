name: golangci-lint
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
permissions:
  contents: read
jobs:
  golangci:
    strategy:
      matrix:
        go: ['1.26.6']
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: lint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/checkout@v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: |
            --config=.config/.golangci.yaml --tests=false --max-issues-per-linter=0 --max-same-issues=0 --timeout 5m0s
