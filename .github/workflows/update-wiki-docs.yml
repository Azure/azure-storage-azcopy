name: Update wiki docs

on:
  release:
    types: [published]

concurrency:
  group: wiki
  cancel-in-progress: true

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
      with:
        go-version: '1.25.11'

    - name: Build Binary and generate doc markdown files
      run: |
        mkdir -p output
        go build -o output/azcopy
        cd output
        ./azcopy doc --format wiki
        cd doc
        sed -i 's/\.md//' *

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: build-artifacts
        path: output/doc/

    - name: Checkout Wiki
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: ${{github.repository}}.wiki
        path: ${{github.repository}}.wiki

    - name: Push to wiki
      run: |
        set -e
        cd $GITHUB_WORKSPACE/${{github.repository}}.wiki
        cp -r ../../output/doc/* .
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff-index --quiet HEAD || git commit -m "action: wiki sync" && git push
