# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Version updates skip indirect modules by default; include them so
    # vulnerable transitive dependencies are bumped too.
    allow:
      - dependency-type: "all"


