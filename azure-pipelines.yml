# TEMPORARY (do not merge): reduced pipeline to check whether
# AZCOPY_AUTO_LOGIN_TYPE=WORKLOAD regressed between AzCopy 10.28.0 and 10.32.0.
variables:
  AZCOPY_GOLANG_VERSION: '1.25.11'
  AZCOPY_GOLANG_VERSION_COVERAGE: '1.25.11'

trigger: none
pr: none

jobs:
  - job: WI_Release_Probe
    timeoutInMinutes: 30
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      matrix:
        v10_28_0:
          AZCOPY_PROBE_VERSION: '10.28.0'
        v10_32_0:
          AZCOPY_PROBE_VERSION: '10.32.0'
        v10_34_1:
          AZCOPY_PROBE_VERSION: '10.34.1'
    steps:
      - bash: |
          set -euo pipefail
          ver="$(AZCOPY_PROBE_VERSION)"
          dir="$(Agent.TempDirectory)/azcopy-$ver"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/Azure/azure-storage-azcopy/releases/download/v${ver}/azcopy_linux_amd64_${ver}.tar.gz" | tar -xz -C "$dir" --strip-components=1
          "$dir/azcopy" --version
          echo "##vso[task.setvariable variable=AZCOPY_PROBE_BIN]$dir/azcopy"
        displayName: 'Download AzCopy $(AZCOPY_PROBE_VERSION)'

      - task: AzureCLI@2
        inputs:
          azureSubscription: azcopytestworkloadidentity
          addSpnToEnvironment: true
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: azurePipelineTemplates/wi-release-probe.sh
        env:
          AZCOPY_PROBE_ACCOUNT_NAME: $(AZCOPY_E2E_ACCOUNT_NAME)
          AZCOPY_PROBE_ACCOUNT_KEY: $(AZCOPY_E2E_ACCOUNT_KEY)
        displayName: 'Probe WORKLOAD auto-login with AzCopy $(AZCOPY_PROBE_VERSION)'

  - template: azurePipelineTemplates/run-e2e.yml
    parameters:
      job_name: 'New_E2E_WorkloadIdentity'
      test_cli_param: '-run "TestNewE2E/WorkloadIdentitySuite"'
